version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bistrodungu-postgres
    environment:
      POSTGRES_DB: bistrodungu
      POSTGRES_USER: bistrodungu
      POSTGRES_PASSWORD: bistrodungu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bistrodungu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bistrodungu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bistrodungu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bistrodungu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bistrodungu-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bistrodungu
      DB_USER: bistrodungu
      DB_PASSWORD: bistrodungu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bistrodungu-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bistrodungu-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - bistrodungu-network

networks:
  bistrodungu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
